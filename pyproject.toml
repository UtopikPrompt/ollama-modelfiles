[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-modelfiles"
version = "0.1.0"
description = "Tools for creating Ollama model files"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "UtopikPrompt"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "pytest>=8.0",
    "pyyaml>=6.0",
    "huggingface-hub >= 0.24.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.1.0",
    "yamlfmt>=0.12.0",
]

[project.scripts]
# Add any CLI commands here

[tool.ruff]
# Enable all rules, then disable specific ones
select = [
    # Pyflakes
    "F",
    # pycodestyle
    "E",
    "W",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # pyupgrade
    "UP",
]
ignore = [
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class
    "D102",  # Missing docstring in public method
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method
    "D107",  # Missing docstring in __init__
]

# Line length matching black
line-length = 88

# Exclude generated files
exclude = [
    ".egg-info/",
    ".git/",
    ".pytest_cache/",
    "__pycache__/",
    "build/",
    "dist/",
    "venv/",
    "models/",
]

[tool.ruff.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103"]
"tests/__init__.py" = ["D104"]

[tool.ruff.format]
# Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["D100", "D101", "D102", "D103"]
"tests/__init__.py" = ["D104"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--tb=short",
    "-v",
]

[tool.coverage.run]
source = ["ollama-modelfiles"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@overload",
    "except ImportError",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
skip = [".egg-info", ".git", ".pytest_cache", "__pycache__", "build", "dist", "venv", "models"]

[tool.black]
line-length = 88
target-version = ["py310", "py311", "py312", "py313", "py314"]

[tool.typos]
[default]
extend-ignore-words = [
    "modelfile",
    "modelfiles",
    "modelfilegen",
    "modelfilegenerator",
]

[files]
# Ignore model files
ignore = ["models/"]

[extend-defaults]
ignore-hidden-files = true

[tool.setuptools.packages.find]
where = ["."]