# Ollama Modelfiles Configuration
# Flat YAML format - values are directly copied to Modelfile
# No inheritance - Ollama's defaults are overridden by these values

# Context Window
NUM_CTX: "65536"

# Max Output Tokens
# NUM_PREDICT: "${NUM_PREDICT}"

# System Prompt
# SYSTEM: "${SYSTEM}"

# Sampling Parameters
# TEMPERATURE: 0.7
# TOP_P: 0.9
# TOP_K: 40
# REPEAT_PENALTY: 1.1
# REPEAT_LAST_N: 64
# REPEAT_PENALTY_PREFIX: 1.1
# MIN_P: 0.1
# MINING_P: 0.5
# SEED: 42

# Mirostat Parameters
# MIROSTAT: 0
# MIROSTAT_TAU: 5.0
# MIROSTAT_ETA: 0.1
# PENALIZE_NEW_TOKENS: 0.5

# Context & Token Limits
# NUM_PREDICT: 4096
# NUM_CTX: 65536
# NUM_BATCH: 512

# Hardware Parameters
# NUM_THREAD: 4
# NUM_GPU: -1
# SWAP_SPACE: 4

# Additional Parameters
# NUM_KEEP: 4
# MAIN_GPU: 0
# NUMA: false
# LOW_VRAM: false
# F16_KV: true
# VOCAB_ONLY: false
# USE_MMAP: true
# USE_MLOCK: false
# EMBEDDING_ONLY: false

# Stop Sequences
# STOP_1: "<|eot_id|>"
# STOP_2: "User:"
# STOP_3: "Assistant:"
