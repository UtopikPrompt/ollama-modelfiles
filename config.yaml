# Ollama Modelfiles Configuration
# Flat YAML format - values are directly copied to Modelfile
# No inheritance - Ollama's defaults are overridden by these values

# Context Window
num_ctx: "65536"

# Max Output Tokens
# num_predict: "${NUM_PREDICT}"

# System Prompt
# system: "${SYSTEM}"

# Sampling Parameters
# temperature: 0.7
# top_p: 0.9
# top_k: 40
# repeat_penalty: 1.1
# repeat_last_n: 64
# repeat_penalty_prefix: 1.1
# min_p: 0.1
# mining_p: 0.5
# seed: 42

# Mirostat Parameters
# mirostat: 0
# mirostat_tau: 5.0
# mirostat_eta: 0.1
# penalize_new_tokens: 0.5

# Context & Token Limits
# num_predict: 4096
# num_ctx: 65536
# num_batch: 512

# Hardware Parameters
# num_thread: 4
# num_gpu: -1
# swap_space: 4

# Additional Parameters
# num_keep: 4
# main_gpu: 0
# numa: false
# low_vram: false
# f16_kv: true
# vocab_only: false
# use_mmap: true
# use_mlock: false
# embedding_only: false

# Stop Sequences
# stop_1: "<|eot_id|>"
# stop_2: "User:"
# stop_3: "Assistant:"
